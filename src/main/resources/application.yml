spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: rookies

  # MySQL
  datasource:
    url: jdbc:mysql://localhost:3306/rookies?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Spring Data JPA (Hibernate)
  jpa:
    hibernate:
      ddl-auto: update        # 개발용. 운영에서는 validate 또는 none
    open-in-view: false
    show-sql: false           # SQL 로그는 아래 logging 설정으로 출력
    properties:
      hibernate:
        format_sql: true

  # Thymeleaf
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false              # DevTools가 있으면 개발 중에는 자동으로 false

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace   # 바인딩 파라미터 값 출력