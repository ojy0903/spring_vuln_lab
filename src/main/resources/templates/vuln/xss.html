<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시판</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 860px; margin: 40px auto; padding: 0 16px; color: #1a1a1a; }
        form { display: flex; gap: 8px; margin: 20px 0; }
        form.write { flex-direction: column; }
        .search input { flex: 1; }
        input[type=text], textarea { padding: 10px 12px; font-size: 1rem; border: 1px solid #ccc; border-radius: 6px; }
        button { padding: 10px 18px; font-size: 1rem; border: 0; border-radius: 6px; background: #2563eb; color: #fff; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #e2e2e2; padding: 8px 10px; text-align: left; font-size: 0.92rem; }
        th { background: #f5f5f5; }
    </style>
</head>
<body>
<h1>게시판</h1>

<!-- 검색: GET /vuln/xss?keyword=... -->
<form class="search" method="get" th:action="@{/vuln/xss}">
    <input type="text" name="keyword" placeholder="제목으로 검색" th:value="${keyword}">
    <button type="submit">검색</button>
</form>

<!-- 취약점: 컨트롤러가 문자열 연결로 만든 HTML을 th:utext로 이스케이프 없이 출력 (Reflected XSS) -->
<p th:if="${message != null}" th:utext="${message}"></p>

<table>
    <thead>
    <tr><th>post_id</th><th>title</th></tr>
    </thead>
    <tbody>
    <tr th:each="post : ${posts}">
        <td th:text="${post.id}"></td>
        <!-- 제목은 th:text → 이스케이프됨 (비교용) -->
        <td><a th:href="@{/vuln/xss/posts/{id}(id=${post.id})}" th:text="${post.title}"></a></td>
    </tr>
    </tbody>
</table>

<h2>글쓰기</h2>
<form class="write" method="post" th:action="@{/vuln/xss/posts}">
    <input type="text" name="title" placeholder="제목" required>
    <textarea name="content" rows="6" placeholder="내용 (HTML 서식 사용 가능)" required></textarea>
    <button type="submit">등록</button>
</form>
</body>
</html>
