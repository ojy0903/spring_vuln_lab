<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 검색</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 860px; margin: 40px auto; padding: 0 16px; color: #1a1a1a; }
        h1 { font-size: 1.4rem; }
        form { display: flex; gap: 8px; margin: 20px 0; }
        input[type=text] { flex: 1; padding: 10px 12px; font-size: 1rem; border: 1px solid #ccc; border-radius: 6px; }
        button { padding: 10px 18px; font-size: 1rem; border: 0; border-radius: 6px; background: #2563eb; color: #fff; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        th, td { border: 1px solid #e2e2e2; padding: 8px 10px; text-align: left; font-size: 0.92rem; vertical-align: top; }
        th { background: #f5f5f5; }
        .muted { color: #888; }
        .count { margin-top: 20px; color: #555; font-size: 0.9rem; }
    </style>
</head>
<body>
<h1>게시글 검색</h1>

<!-- 검색 폼: GET /vuln/sqli/search?keyword=... -->
<form method="get" th:action="@{/vuln/sqli/search}">
    <input type="text" name="keyword" placeholder="제목으로 검색"
           th:value="${keyword}" autofocus>
    <button type="submit">검색</button>
</form>

<!-- results가 모델에 있을 때만 결과 영역 렌더 (첫 화면 /sqli 에서는 검색창만 보임) -->
<div th:if="${results != null}">
    <p class="count">
        '<span th:text="${keyword}">keyword</span>' 검색 결과:
        <strong th:text="${#lists.size(results)}">0</strong>건
    </p>

    <table th:if="${!#lists.isEmpty(results)}">
        <thead>
        <tr>
            <th>post_id</th>
            <th>title</th>
            <th>content</th>
            <th>is_secret</th>
        </tr>
        </thead>
        <tbody>
        <!-- queryForList → 각 row는 Map. th:text 로 이스케이프 렌더(이번 회차는 XSS와 분리) -->
        <tr th:each="row : ${results}">
            <td th:text="${row['post_id']}"></td>
            <td th:text="${row['title']}"></td>
            <td th:text="${row['content']}"></td>
            <td th:text="${row['is_secret']}"></td>
        </tr>
        </tbody>
    </table>

    <p th:if="${#lists.isEmpty(results)}" class="muted">검색 결과가 없습니다.</p>
</div>
</body>
</html>
